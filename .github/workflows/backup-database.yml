name: Manual encrypted database backup

on:
  workflow_dispatch:
    inputs:
      confirm_quiet_source:
        description: 'I paused application writes and concurrent schema/role changes for this backup'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: manual-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require explicit confirmation and the default branch
        env:
          CONFIRMED: ${{ inputs.confirm_quiet_source }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! test "$CONFIRMED" = true; then
            echo '::error::Quiet-source confirmation was not true for this dispatch. Start a new run with Run workflow and check the confirmation after pausing writes and schema/role changes. Re-running a job does not change its original inputs.'
            exit 1
          fi
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Production secrets are supplied to the backup step only, never install scripts.
      - run: pnpm install --frozen-lockfile
      - name: Start disposable PostgreSQL 17 and backup tools on the hosted runner
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/chatbit-backup"
          docker run --detach --name chatbit-backup-pg17 \
            --publish 127.0.0.1:55432:5432 \
            --mount "type=bind,src=$RUNNER_TEMP/chatbit-backup,dst=/backup" \
            --env POSTGRES_PASSWORD=disposable-backup-rehearsal-only \
            --env POSTGRES_DB=restore_test postgres:17-bookworm
          for attempt in {1..30}; do
            if docker exec chatbit-backup-pg17 pg_isready -U postgres -d restore_test >/dev/null 2>&1; then
              docker exec chatbit-backup-pg17 pg_dump --version
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Read-only export, encryption, checksum verification and isolated restore
        run: node scripts/backup-database.mjs
        env:
          SUPABASE_BACKUP_HOST: ${{ secrets.SUPABASE_BACKUP_HOST }}
          SUPABASE_BACKUP_USER: ${{ secrets.SUPABASE_BACKUP_USER }}
          SUPABASE_BACKUP_PASSWORD: ${{ secrets.SUPABASE_BACKUP_PASSWORD }}
          SUPABASE_BACKUP_CA: ${{ secrets.SUPABASE_BACKUP_CA }}
          CHATBIT_BACKUP_PASSPHRASE: ${{ secrets.CHATBIT_BACKUP_PASSPHRASE }}
      # Preserve a completed encrypted export even when the subsequent restore fails.
      # A red run must never be treated as a restore-verified backup.
      - name: Upload encrypted backup and ciphertext checksum only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatbit-encrypted-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chatbit-backup/encrypted/chatbit-backup.tar.enc
            ${{ runner.temp }}/chatbit-backup/encrypted/chatbit-backup.tar.enc.sha256
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: Remove disposable database, plaintext and runner copies
        if: always()
        run: |
          docker rm --force --volumes chatbit-backup-pg17 >/dev/null 2>&1 || true
          rm -rf -- "$RUNNER_TEMP/chatbit-backup"
