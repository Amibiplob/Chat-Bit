name: Verify ChatBit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chatbit
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: chatbit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chatbit -d chatbit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 12.3.4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify isolated headless Chrome and runtime dependencies
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          node --input-type=module -e 'import { withBrowser } from "./tests/helpers/browser.mjs"; await withBrowser(async ({ evaluate }) => { if (await evaluate("1 + 1") !== 2) throw new Error("Chrome JavaScript smoke test failed"); });'
      - name: Verify plain PostgreSQL readiness without synthetic client roles
        run: node --test tests/neon-readiness.integration.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://chatbit:isolated-ci-only@127.0.0.1:5432/chatbit_test
          TEST_DATABASE_SSL: disable
      - name: Prepare disposable PostgreSQL security fixture
        run: |
          test "$(psql -h 127.0.0.1 -U chatbit -d chatbit_test -Atc 'SHOW server_version_num' | cut -c1-2)" = 17
          psql -h 127.0.0.1 -U chatbit -d chatbit_test -v ON_ERROR_STOP=1 -f tests/fixtures/security.sql
        env:
          PGPASSWORD: isolated-ci-only
      - name: Unit, PostgreSQL, HTTP and Chrome integration
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-results.log
        env:
          TEST_DATABASE_URL: postgresql://chatbit:isolated-ci-only@127.0.0.1:5432/chatbit_test
          TEST_DATABASE_SSL: disable
          TEST_SECURITY_DATABASE_URL: postgresql://chatbit:isolated-ci-only@127.0.0.1:5432/chatbit_test
          TEST_SECURITY_DATABASE_SSL: disable
          TEST_AUTH_HTTP: '1'
          TEST_NEXT_TURBOPACK: '1'
          TEST_NAVIGATION_BROWSER: '1'
          TEST_WORKSPACE_BROWSER: '1'
          TEST_SPA_BROWSER: '1'
          TEST_SPA_SYNC_ACCEPTANCE: '1'
          TEST_CALLING_BROWSER: '1'
          TEST_PUSH_TRANSPORT: '1'
          TEST_PUSH_BROWSER: '1'
          CHROME_BIN: /usr/bin/google-chrome
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm audit --prod
      - run: pnpm build
      - name: Production PWA and responsive Chrome smoke tests
        env:
          CHROME_BIN: /usr/bin/google-chrome
          CHATBIT_BROWSER_ORIGIN: http://127.0.0.1:3187
        run: |
          set -euo pipefail
          pnpm exec next start --hostname 127.0.0.1 --port 3187 > /tmp/chatbit-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3187/manifest.webmanifest > /dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          node scripts/check-browser.mjs
          # A synthetic cookie must fail closed with no production DB configuration.
          TEST_RUNTIME_ORIGIN=http://127.0.0.1:3187 TEST_RUNTIME_PRODUCTION=1 TEST_RUNTIME_DATABASE_FAILURE=1 node --test tests/runtime.browser.test.mjs
      - run: git diff --check
      - name: Preserve regression and security test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chatbit-test-results
          path: test-results.log
          if-no-files-found: ignore
