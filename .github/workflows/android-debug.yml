name: Build ChatBit Debug APK
on:
  workflow_dispatch:
    inputs:
      origin:
        description: 'Deployed ChatBit HTTPS origin (for example https://your-app.vercel.app), without a path'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: chatbit-debug-${{ github.ref }}
  cancel-in-progress: false
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHATBIT_ANDROID_ORIGIN: ${{ inputs.origin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - run: npm ci --prefix android --ignore-scripts --no-audit --no-fund
      - name: Validate requested origin and debug configuration
        run: node android/generate.mjs --debug --check
      - name: Test packaging and generated Gradle configuration
        run: npm test --prefix android
      - name: Generate existing TWA project with checked-in ChatBit icons
        run: node android/generate.mjs --debug
      - name: Compile and verify installable debug-signed APK
        run: node android/build.mjs --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ChatBit-debug-apk
          path: android/generated/ChatBit-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        run: |
          echo 'Download ChatBit-debug-apk from this run’s Artifacts section and unzip ChatBit-debug.apk.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Debug signing only; no public release or Digital Asset Links verification. Chrome may show its toolbar.' >> "$GITHUB_STEP_SUMMARY"
